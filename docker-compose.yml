services:
  patch-notes:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Night compiler backend: claude_code (default, Claude Code headless) or anthropic (API)
      PN_AGENT_PROVIDER: ${PN_AGENT_PROVIDER:-claude_code}
      # claude_code: a token from `claude setup-token` (Claude subscription) or an API key
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEBUG: ${DEBUG:-0}
      # Any tunable from backend/app/config.py, e.g.:
      # PN_PLAY_SECONDS: "420"
      # PN_COMPILE_MODEL: "claude-sonnet-5-5"
    volumes:
      - ./data:/data
    restart: unless-stopped
